<!doctype html>
<html lang="zh-CN" data-style="solid">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <script>
      // Resolve the local preference before stylesheets or Vue can paint.
      ;(function () {
        var pref = 'system'
        try { pref = localStorage.getItem('lg_theme') || 'system' } catch (_) {}
        var dark = pref === 'dark' || (pref !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      })()
    </script>
    <style>:root{color-scheme:light;background:#fbfbfe}:root[data-theme=dark]{color-scheme:dark;background:#0d1017}</style>
    <title>wusaqi-gallery</title>
    <meta name="description" content="自部署图片画廊，附带随机图片 API。" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
