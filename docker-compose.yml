# 源码构建部署（本机开发 / 自定义修改时用）
# 拉取镜像部署请用 docker-compose.hub.yml
services:
  gallery:
    build: .
    container_name: wusaqi-gallery
    restart: unless-stopped
    environment:
      # ---- 管理员账号（首次启动播种；库已存在则不覆盖）----
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      # 忘记密码时设 1：每次启动把库里的管理员用户名/密码覆盖成上面两项
      - ADMIN_SYNC=${ADMIN_SYNC:-0}
      - DATA_DIR=/data
      - RATE_LIMIT=${RATE_LIMIT:-120}
    volumes:
      - ./data:/data
    ports:
      - "${WEB_PORT:-8300}:80"
    healthcheck:
      # 经 nginx 全链路探活（反代→uvicorn→数据库）
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1/api/health', timeout=3).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s
