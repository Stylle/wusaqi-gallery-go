# 源码构建部署（本机开发 / 自定义修改时用）
# 拉取镜像部署请用 docker-compose.hub.yml
services:
  gallery:
    build: .
    container_name: wusaqi-gallery
    restart: unless-stopped
    environment:
      # ---- 管理员账号（首次启动播种；库已存在则不覆盖）----
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      # 忘记密码时设 1：每次启动把库里的管理员用户名/密码覆盖成上面两项
      - ADMIN_SYNC=${ADMIN_SYNC:-0}
      - DATA_DIR=/data
      - RATE_LIMIT=${RATE_LIMIT:-120}
      - TZ=${TZ:-Asia/Shanghai}
      - GOMEMLIMIT=${GOMEMLIMIT:-40MiB}
      - GOGC=${GOGC:-50}
      - TRUSTED_PROXIES=${TRUSTED_PROXIES:-}
    volumes:
      - ./data:/data
    ports:
      - "${WEB_PORT:-8300}:80"
    healthcheck:
      test: ["CMD", "/app/gallery", "healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s
