name: Local release checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: '1'

jobs:
  regression:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache-dependency-path: server/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install image and QA dependencies
        run: python -m pip install -r backend/requirements.txt psutil pyyaml
      - name: Build existing Vue UI
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run build
      - name: Go checks and binary
        working-directory: server
        shell: bash
        run: |
          go test ./...
          go vet ./...
          if [[ "$RUNNER_OS" == "Windows" ]]; then target=gallery.exe; else target=gallery; fi
          go build -trimpath -ldflags="-s -w" -o "$target" .
      - name: Migration, API and deployment regression
        run: |
          python qa/regression.py
          python qa/check-compose.py
      - name: Check README synchronization
        shell: bash
        run: |
          python scripts/sync-docs.py
          git diff --exit-code -- docs/dockerhub-description.md
