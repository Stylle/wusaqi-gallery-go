name: Local release checks

on:
  push:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: '1'

jobs:
  regression:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache-dependency-path: server/go.sum
      - name: Maintenance contracts
        run: python scripts/check-maintenance.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install image and QA dependencies
        run: python -m pip install -r backend/requirements.txt psutil pyyaml
      - name: Build existing Vue UI
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm audit --omit=dev
          npm test
          npm run build
      - name: Go checks and binary
        working-directory: server
        shell: bash
        run: |
          go test ./...
          go vet ./...
          if [[ "$RUNNER_OS" == "Windows" ]]; then target=gallery.exe; else target=gallery; fi
          go build -trimpath -ldflags="-s -w" -o "$target" .
      - name: Isolated browser regression
        if: runner.os == 'Linux'
        run: |
          npm install --prefix .browser-qa --no-package-lock --no-save --no-audit playwright@1.56.1
          node .browser-qa/node_modules/playwright/cli.js install --with-deps chromium
          node scripts/browser-regression.cjs
      - name: Go dependency security
        working-directory: server
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Migration, API and deployment regression
        run: |
          python qa/regression.py
          python qa/features.py
          python qa/reliability.py
          python qa/privacy.py
          python qa/metadata.py
          python qa/metadata-cleanup.py
          python qa/check-compose.py
      - name: Check README synchronization
        shell: bash
        run: |
          python scripts/sync-docs.py
          git diff --exit-code -- docs/dockerhub-description.md

  container:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install QA image codecs
        run: python -m pip install -r backend/requirements.txt
      - name: Build the actual deployment image
        run: docker build -t wusaqi-gallery:ci .
      - name: Default non-root container startup
        run: python qa/container-user.py
      - name: Run full regression against the container
        env:
          QA_DOCKER_IMAGE: wusaqi-gallery:ci
        run: |
          python qa/regression.py
          python qa/features.py
          python qa/reliability.py
          python qa/privacy.py
          python qa/metadata.py
          python qa/metadata-cleanup.py
