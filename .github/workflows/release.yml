name: Publish versioned image
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: stylle/wusaqi-gallery:latest,stylle/wusaqi-gallery:${{ github.ref_name }}
          sbom: true
          provenance: mode=max
      - name: Publish deployment guide
        env:
          HUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: python3 scripts/publish-overview.py
